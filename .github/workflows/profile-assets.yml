name: Update profile assets

on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-assets.yml'

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Activity statistics (light)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=peter-lizijia&show_icons=true&hide_rank=true&hide=stars,issues&show=reviews&card_width=390&title_color=0f766e&icon_color=0f766e&text_color=334155&bg_color=ffffff&border_color=d1d9e0&custom_title=Public%20GitHub%20activity
          path: assets/stats-light.svg
          core_version: '2.2.1'
          fail_on_error: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Activity statistics (dark)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=peter-lizijia&show_icons=true&hide_rank=true&hide=stars,issues&show=reviews&card_width=390&title_color=5eead4&icon_color=5eead4&text_color=c9d1d9&bg_color=0d1117&border_color=30363d&custom_title=Public%20GitHub%20activity
          path: assets/stats-dark.svg
          core_version: '2.2.1'
          fail_on_error: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Language statistics (light)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=peter-lizijia&layout=compact&langs_count=6&card_width=390&exclude_repo=peter-lizijia&title_color=0f766e&text_color=334155&bg_color=ffffff&border_color=d1d9e0&custom_title=Languages%20in%20public%20repos
          path: assets/languages-light.svg
          core_version: '2.2.1'
          fail_on_error: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Language statistics (dark)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=peter-lizijia&layout=compact&langs_count=6&card_width=390&exclude_repo=peter-lizijia&title_color=5eead4&text_color=c9d1d9&bg_color=0d1117&border_color=30363d&custom_title=Languages%20in%20public%20repos
          path: assets/languages-dark.svg
          core_version: '2.2.1'
          fail_on_error: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg?palette=github-light&color_snake=%230f766e
            assets/snake-dark.svg?palette=github-dark&color_snake=%235eead4

      - name: Save generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats-*.svg assets/languages-*.svg assets/snake-*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh profile statistics and contribution snake'
          git pull --rebase origin main
          git push origin HEAD:main
